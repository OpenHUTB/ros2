base_local_planner: "dwa_local_planner/DWAPlannerROS"
controller_frequency: 10.0
planner_patience: 5.0

DWAPlannerROS:
  max_vel_x: 0.4
  min_vel_x: 0.0
  max_vel_theta: 1.0
  min_vel_theta: -1.0
  acc_lim_x: 0.5
  acc_lim_theta: 1.0
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.2

global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency:10.0
  static_map: true
  rolling_window: false
  width:10
  height:10
  resolution:0.05

local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency:10.0
  static_map: false
  rolling_window: true
  width:4
  height:4
  resolution:0.05

