uav_geofence_bypass:
  ros__parameters:
    margin: 0.6            # 禁飞区膨胀裕度 (m)
    accept_radius: 0.3     # 航点切换半径 (m)
    log_period: 1.0        # 日志周期 (s)
    start: [0.0, 0.0]
    goal: [15.0, 0.0]
    # 每个禁飞区是 4 个顶点，按 x1, y1, x2, y2, ... 排列
    zones:
      - [5.0, -1.2, 7.0, -1.2, 7.0, 1.0, 5.0, 1.0]
      - [10.0, -1.0, 12.0, -1.0, 12.0, 1.2, 10.0, 1.2]
