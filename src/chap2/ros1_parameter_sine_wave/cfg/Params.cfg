#!/usr/bin/env python3

PACKAGE = 'ros1_parameter_sine_wave'

from dynamic_reconfigure.parameter_generator_catkin import (
    ParameterGenerator,
    bool_t,
    double_t,
)

gen = ParameterGenerator()

gen.add(
    'amplitude',
    double_t,
    0,
    'Sine wave amplitude',
    1.0,
    0.0,
    10.0,
)
gen.add(
    'frequency_hz',
    double_t,
    0,
    'Sine wave frequency in hertz',
    0.25,
    0.0,
    5.0,
)
gen.add(
    'publish_rate_hz',
    double_t,
    0,
    'ROS message publish rate in hertz',
    20.0,
    1.0,
    100.0,
)
gen.add(
    'phase_rad',
    double_t,
    0,
    'Initial phase in radians',
    0.0,
    -3.141592653589793,
    3.141592653589793,
)
gen.add(
    'enabled',
    bool_t,
    0,
    'Enable or pause publishing',
    True,
)

exit(gen.generate(PACKAGE, 'sine_wave_node', 'Params'))
