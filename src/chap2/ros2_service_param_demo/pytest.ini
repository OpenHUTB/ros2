[pytest]
# 集成测试需要真实 ROS 2 图（服务发现 + 参数回写），在慢机器或与他人节点
# 同时运行时可能超时失败，会让 colcon test 偶发变红。默认不参与收集，
# 需要时显式运行：pytest -m ros_integration
markers =
    ros_integration: 需要真实 ROS 2 图，默认不随 colcon test 执行
    flake8: ament_flake8 代码风格检查
    linter: ament 静态检查（flake8 / pep257）
    pep257: ament_pep257 文档字符串检查
addopts = -m "not ros_integration"
