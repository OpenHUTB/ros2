# 车辆键盘遥操作与二维模拟 —— 可调参数
#
# 由 launch/main.launch 用 <rosparam command="load"> 加载到全局命名空间，
# 再用 <param> 由 launch <arg> 覆盖；节点用 rospy.get_param("vehicle/xxx")
# 之类的相对名读取（相对名会解析到全局命名空间，与上面的 <param> 对应）。
#
# 下面每个值都等于改造前的硬编码常量，因此「不改参数 = 默认行为不变」。

vehicle:
  max_speed: 1.5              # 最大前进速度 m/s
  max_reverse: 0.8            # 最大倒车速度 m/s
  accel: 2.2                  # 油门 / 倒车加速度 m/s^2
  brake: 4.5                  # 刹车减速度 m/s^2
  handbrake: 8.0              # 空格手刹减速度 m/s^2
  drag: 1.2                   # 无按键时滑行阻力减速度 m/s^2
  max_yaw_rate: 1.4           # 最大偏航角速度 rad/s（左转为正）
  yaw_response: 8.0           # 转向响应角加速度 rad/s^2
  reverse_steer_invert: true  # 倒车时转向效果反向（差速底盘特性）

rate:
  publish_hz: 30.0            # /cmd_vel 发布频率 Hz

topic:
  cmd_vel: "/cmd_vel"         # 速度指令话题，与 Carla 等仿真器遥控接口一致
