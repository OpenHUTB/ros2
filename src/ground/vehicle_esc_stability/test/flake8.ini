[flake8]
max-line-length = 99
select = E,W,F
# pycodestyle 默认忽略 W503/W504（二者互斥，二选一）；显式写 select 之后默认忽略
# 不再生效，这里补回来，与 ament 默认行为保持一致。
#
# 必须用 ignore，不能用 extend-ignore：flake8 3.7.9（Ubuntu 20.04 自带）里，若
# ignore 集合恰好等于它自己的默认忽略列表，DecisionEngine 会当成「用户没动过
# ignore」，select 命中的码一律照报；extend-ignore=W503,W504 正好把集合凑成默认
# 值，等于没写。写 ignore = W503,W504 后集合与默认不同，才会按前缀长短比出
# 「W503 比 W 更具体」，W503/W504 才真正被忽略。
# 副作用：默认忽略里的 E121/E123/E126/E226/E24/E704 不再被忽略，本包实测不触发；
# 万一以后触发，应该改代码，别加回 ignore（加回去集合又等于默认值，W503 会复现）。
ignore = W503,W504
