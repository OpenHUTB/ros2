slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
