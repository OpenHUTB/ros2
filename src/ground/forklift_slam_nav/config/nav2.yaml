bt_navigator:
  ros__parameters: {use_sim_time: false, global_frame: map, robot_base_frame: base_link, odom_topic: /odom}
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: nav2_controller::SimpleProgressChecker, required_movement_radius: 0.1, movement_time_allowance: 25.0}
    goal_checker: {plugin: nav2_controller::SimpleGoalChecker, xy_goal_tolerance: 0.2, yaw_goal_tolerance: 0.3, stateful: true}
    FollowPath: {plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController, desired_linear_vel: 0.25, lookahead_dist: 0.45, min_lookahead_dist: 0.2, max_lookahead_dist: 0.7, use_collision_detection: true}
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner/NavfnPlanner, tolerance: 0.4, use_astar: true, allow_unknown: true}
behavior_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 5.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors/Spin}
    backup: {plugin: nav2_behaviors/BackUp}
    drive_on_heading: {plugin: nav2_behaviors/DriveOnHeading}
    wait: {plugin: nav2_behaviors/Wait}
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 1.5, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 8.0, obstacle_max_range: 7.5}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.45, cost_scaling_factor: 3.0}
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.3
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 1.5, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 8.0, obstacle_max_range: 7.5}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.45, cost_scaling_factor: 3.0}
      always_send_full_costmap: true
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    feedback: OPEN_LOOP
    max_velocity: [0.35, 0.0, 1.2]
    min_velocity: [-0.2, 0.0, -1.2]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    velocity_timeout: 1.0
