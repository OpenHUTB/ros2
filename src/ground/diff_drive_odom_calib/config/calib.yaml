# 标定实验参数（main.py 的私有参数）
r_nominal: 0.1035        # 里程计以为的轮半径（真值 0.1000，差 3.5%）
b_nominal: 0.352         # 里程计以为的轮距（真值 0.360，差 2.2%）
straight_distance: 2.0   # 直行实验长度 (m)
straight_speed: 0.30     # 直行速度 (m/s)
rotation_turns: 3.0      # 旋转实验圈数
rotation_speed: 1.00     # 旋转角速度 (rad/s)
square_side: 4.0         # 验证用方形路径边长 (m)
warmup: 1.5              # 丢弃起步瞬态的秒数
