<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ROS小车遥控 | 按键高亮反馈</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
<style>
button{
  width:100px;height:60px;font-size:20px;margin:5px;
  transition: background-color 0.12s ease;
}
/* 按下高亮样式：变暗 */
button.pressed{
  background-color:#666;
  color:white;
}
#video{width:640px;border:2px solid #333;margin:10px 0;}
#status{font-size:18px;color:#c00;}
</style>
</head>
<body>
<h3>ROS小车遥控 | ws://192.168.220.130:9090</h3>
<div id="status">🔌 正在连接rosbridge...</div>
<div>
  <h4>前置相机画面：</h4>
  <img id="video" src="http://192.168.220.130:8080/stream?topic=/front_camera/image_raw" />
</div>
<div>
  <button id="btn_fwd">前进(W/↑)</button>
</div>
<div>
  <button id="btn_left">左转(A/←)</button>
  <button id="btn_stop">停止(空格)</button>
  <button id="btn_right">右转(D/→)</button>
</div>
<div>
  <button id="btn_bwd">后退(S/↓)</button>
</div>

<script>
const ROS_BRIDGE_URL = "ws://192.168.220.130:9090";
const ros = new ROSLIB.Ros({ url: ROS_BRIDGE_URL });
const statusDom = document.getElementById("status");

ros.on('connection', ()=>{
  statusDom.innerText = "✅ rosbridge连接成功";
  statusDom.style.color="green";
})
ros.on('error', (err)=>{
  statusDom.innerText = "❌ 连接失败："+err;
  statusDom.style.color="red";
})
ros.on('close', ()=>{
  statusDom.innerText = "🔌 连接断开";
  statusDom.style.color="orange";
})

const cmdVelTopic = new ROSLIB.Topic({
  ros: ros,
  name: '/cmd_vel',
  messageType: 'geometry_msgs/Twist'
});

function sendVel(linear_x, angular_z){
  cmdVelTopic.publish({
    linear:{x:linear_x,y:0,z:0},
    angular:{x:0,y:0,z:angular_z}
  })
}
const SPEED = 0.3;
const TURN_SPEED = 0.4;

// 按钮点击事件
document.getElementById('btn_fwd').onclick = ()=>sendVel(SPEED, 0);
document.getElementById('btn_bwd').onclick = ()=>sendVel(-SPEED, 0);
document.getElementById('btn_left').onclick = ()=>sendVel(0, TURN_SPEED);
document.getElementById('btn_right').onclick = ()=>sendVel(0, -TURN_SPEED);
document.getElementById('btn_stop').onclick = ()=>sendVel(0,0);

// 按键映射：key名字 对应按钮ID
const keyMap = {
  'w': 'btn_fwd',
  'arrowup': 'btn_fwd',
  's': 'btn_bwd',
  'arrowdown': 'btn_bwd',
  'a': 'btn_left',
  'arrowleft': 'btn_left',
  'd': 'btn_right',
  'arrowright': 'btn_right',
  ' ': 'btn_stop'
};

// 按下按键：高亮按钮 + 发速度
document.addEventListener('keydown', (e)=>{
  const key = e.key.toLowerCase();
  const btnId = keyMap[key];
  if(!btnId) return;
  const btn = document.getElementById(btnId);
  btn.classList.add('pressed');

  switch(key){
    case 'w':
    case 'arrowup':
      sendVel(SPEED,0); break;
    case 's':
    case 'arrowdown':
      sendVel(-SPEED,0); break;
    case 'a':
    case 'arrowleft':
      sendVel(0,TURN_SPEED); break;
    case 'd':
    case 'arrowright':
      sendVel(0,-TURN_SPEED); break;
    case ' ':
      sendVel(0,0); break;
  }
})

// 松开按键：取消高亮
document.addEventListener('keyup', (e)=>{
  const key = e.key.toLowerCase();
  const btnId = keyMap[key];
  if(!btnId) return;
  const btn = document.getElementById(btnId);
  btn.classList.remove('pressed');
})
</script>
</body>
</html>
