# AEB 决策参数（与 carla_aeb_braking/aeb_core.py 的 AEBParams 一一对应）
# 单位：距离 m，速度 m/s

# ---- 预警（warning）----
warn_enter: 18.0    # 进入预警：前方距离低于此值
warn_exit: 24.0     # 退出预警：前方距离高于此值（滞回，防抖动）

# ---- 紧急制动（braking）----
brake_enter: 7.0    # 进入紧急制动：前方距离低于此值 且 正在接近
brake_exit: 12.0    # 退出紧急制动：前方距离高于此值（滞回）
close_min: 0.5      # 判定“正在接近”的最小相对接近速度

# ---- 控制输出 ----
cruise_throttle: 0.55   # 巡航油门
warn_brake: 0.15        # 预警时的温和预制动（过强会拖垮接近速度，使全力制动不触发）
brake_max: 1.0          # 紧急制动（全力刹车）

# ---- 深度测距有效范围 ----
valid_min: 0.3          # 低于此值的深度视为车身自身，忽略
valid_max: 80.0         # 高于此值视为无障碍
