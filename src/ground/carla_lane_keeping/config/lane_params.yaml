# 车道线检测与车道保持参数
#
# 检测段（detection）的参数名与 lane_detection.LaneFitConfig 字段一一对应，
# 节点会用 rosparam 自动读取，新增字段无需改节点代码。
#
# 两套透视方案，由 use_calibration 切换：
#   true （默认）相机标定模式：按针孔模型把「地面矩形」映射成鸟瞰图，
#                米/像素由相机内参决定，横向偏差有真实物理意义。
#   false        比例模式：沿用手工梯形比例，只适合合成图 / 单元测试。
#
# 标定提示：
#   真实 CARLA 前视相机的路面纹理梯度中位数约 45、90 分位约 260，
#   而车道标线边缘梯度在 236~740 区间。检测器默认采用「自适应阈值」
#   （取该图像梯度分布的 sobel_auto_percentile 分位，且不低于 sobel_min），
#   因此不必为不同地图反复调 sobel_min。

# ---------------- 二值化 ----------------
# 梯度幅值保底阈值；实际阈值 = max(该值, 图像梯度分位数)
sobel_min: 100.0
# 梯度幅值上限，过滤过曝/极端边缘
sobel_max: 900.0
# 自适应分位数：取图像梯度分布的这一分位作为阈值（越高越严格）
sobel_auto_percentile: 98.5
# 允许的最大梯度方向角（度）。竖直车道线的梯度角接近 0 度；
# 该值越大越能容纳弯道，但也会引入更多斜向噪声
angle_max_deg: 45.0
# 是否叠加颜色阈值（白/黄车道线）
use_color: true
# 白色判定下界（三通道最小值）。
# 实测 CARLA 街景里白线 minc≈170~189，沥青路面 minc≈128~135，
# 取 160 能干净分开；取 190 会把真实白线整条漏掉
white_min: 160

# ---------------- 相机标定 ----------------
# 是否启用标定模式。真实相机务必为 true，否则横向偏差只是像素比例，没有物理意义
use_calibration: true
# 相机水平视场角（CARLA sensor.camera.rgb 的 fov 属性）
camera_hfov_deg: 90.0
# 相机离地高度（米）。注意是**地面到光心**的高度，不是相对车体原点的 z
camera_height_m: 1.70
# 相机俯仰角（度，光轴向下为正）。CARLA 里 Rotation.pitch = -8 对应此处 +8
camera_pitch_deg: 8.0

# 鸟瞰图覆盖的地面矩形
#
# d_near / d_far 取 3.5~15 m 是有依据的：800x600 / FOV90 / 高 1.7 m / 俯仰 8°
# 时地平线在第 244 行，车前 15 m 对应第 292 行、3.5 m 对应第 400 行——整条
# 有效地面只占约 156 行。远端再远，竖向分辨率会退化到 1 m/px 以上；近端再近，
# 横向四角会落到图像外。
d_near_m: 3.5
d_far_m: 15.0
bev_half_width_m: 3.2

# 统计直方图用的距离段（米）。跳过最远端（噪声大）与最近端（车身/阴影）
hist_band_m: [5.0, 13.0]

# 车道宽先验：鸟瞰图是等比的地面正视图，左右边界配对正确时列距恒等于车道宽，
# 这是全局最强的约束，比「找两个最强峰」稳得多
lane_width_m: 3.5
lane_width_tol_m: 0.6

# 当前帧检出失败时最多沿用上一帧拟合多少帧（20 Hz 下 10 帧 = 0.5 s）
max_stale_frames: 10

# 稳健化重拟合的取点半宽（像素）。车道线本身宽约 15 px，取 18 px 只保留曲线
# 附近的像素，把虚线缺口边缘、路面亮斑挡在外面
refine_tol_px: 18.0

# 直方图左右各裁掉多少米。透视梯形的边界正好压在路缘/人行道上，那里有连续的
# 亮边，会在鸟瞰图最左/最右列堆出一个假峰（实测高度 400+，比真车道线还高）
hist_trim_m: 0.3

# ---------------- 透视变换（仅比例模式使用） ----------------
# 提供 camera_* 且 use_calibration=true 时，下面 6 个参数全部失效，
# 梯形由相机模型反推得到。保留它们是为了兼容合成图与单元测试。
#
# bottom_ratio 必须为 1.0，使「最近处」与图像底行对齐，
# 否则横向偏差会对应到更远处，产生系统性误差
bottom_ratio: 1.0
top_ratio: 0.58
# 梯形下边半宽（相对图像宽度）。太小会导致车辆偏移后车道线被裁掉
bottom_half_width_ratio: 0.42
# 梯形上边半宽。太小会导致远处车道线跑出视野
top_half_width_ratio: 0.28
# 鸟瞰图左右留白
margin_ratio: 0.20
# 鸟瞰图上下留白（防止近处像素映射到图像外被丢弃）
vertical_margin_ratio: 0.02

# ---------------- 车道线拟合 ----------------
# 滑动窗口数量（仅在直方图找起点失败、退回滑动窗口时需要）
n_windows: 9
# 单侧最少车道像素数，低于此认为该侧未检出
min_lane_pixels: 150
# 滑动窗口（兜底算法）的窗口半宽
window_margin_px: 100
# 滑动窗口内至少多少像素才重新居中
min_pixels_to_recenter: 40
# 多项式阶数（2 = 二次，可表达弯道）
poly_degree: 2

# 连通域几何约束：真实车道线在鸟瞰图中是细长结构。
# 缺少这组约束时，一块被误阈值化的路面会被当成车道线且不报错
max_component_fill_ratio: 0.45
max_component_width_px: 260
max_component_width_ratio: 0.45
max_component_area_ratio: 0.18

# ---------------- 物理标定（仅比例模式使用） ----------------
# 标定模式下这两个值由相机模型算出（实测 0.0080 / 0.0192 m/px），这里填什么都无效。
# 比例模式下俯视相机可推算：
#     meters_per_pixel = 2 * 高度 * tan(水平FOV/2) / 图像宽度
# 这里的 0.021 是按真实 CARLA 帧在比例模式下量出来的；代码默认值 0.05 只是通用占位。
# 换相机必须重新量：量出鸟瞰图中左右线间距（像素），除以真实车道宽（约 3.5 m）。
meters_per_pixel_x: 0.021
meters_per_pixel_y: 0.05

# ---------------- 节点运行 ----------------
# 前视相机图像话题
image_topic: /carla/ego_vehicle/rgb_front/image
# 是否发布鸟瞰掩码（lane/mask）
publish_debug: true
# 每多少帧发一次调试掩码
debug_every: 5
# 横向偏差超过此值判定为偏离车道（米）
departure_threshold_m: 1.0
# 置信度低于此值不输出横向偏差（避免把误检当成有效测量）
min_confidence: 0.5

# ---------------- 车道保持控制 ----------------
# 横向 PID 增益
kp: 0.28
ki: 0.02
kd: 0.06
# 航向偏差的比例增益
k_psi: 0.9
# 转向输出限幅（CARLA 的 steer 范围是 [-1, 1]）
steering_limit: 0.7
# 积分限幅，防积分饱和
integral_limit: 2.0
# 若实测转向方向相反，把这里改为 true（无需改代码）
invert_steering: false

# 一阶低通系数：0 表示不滤波，越大跟随越快。
# 单帧横向偏差有 ±0.05~0.1 m 抖动，D 项会把它放大成方向盘打摆
# （实测 steer 在 ±0.3 之间摆），取 0.35 可压到 ±0.1 以内
filter_alpha: 0.35

# 目标速度（m/s）
target_speed: 6.0
# 速度闭环增益：throttle = speed_gain * (target_speed - v)
speed_gain: 0.35
# 里程计话题，用于取当前车速做速度闭环；置空则退化为开环油门
speed_topic: /carla/ego_vehicle/odometry
# 开环退化时用的油门增益（speed_topic 为空或收不到里程计时生效）
throttle_gain: 0.18
# 偏差越大越减速的系数（保证修正余量）
speed_correction_gain: 0.25

# 控制输出频率（Hz）
control_rate: 20.0
# 感知数据超时（秒）：超过则认为感知失效，停止转向输出
perception_timeout: 0.5
# 判定偏离时是否主动刹车
brake_on_departure: false
