# 纵向速度控制参数
#
# 单位统一为国际单位制：m/s、m/s²、m/s³、1/m、s
#
# 标定方法见 docs/ground/carla_speed_control/speed_control.md 第 6 节。
# 下面的值是 CARLA 默认车辆（vehicle.tesla.model3）量级的示例，
# 换车后需要重新标定。

# ---------------- 目标速度 ----------------
# 无曲率限制时的巡航速度（m/s）。12.0 m/s ≈ 43.2 km/h
target_speed: 12.0

# ---------------- PID 参数 ----------------
# 比例项：速度误差到加速度的增益
kp: 1.0
# 积分项：消除稳态误差。取值偏小以抑制超调
ki: 0.15
# 微分项：抑制超调的主要手段
kd: 0.35
# 前馈增益：目标加速度按此比例直接前馈（1.0 为全前馈）
kff: 1.0
# 积分项上限（m/s²），防止积分饱和
integral_limit: 2.0

# ---------------- 载具能力约束 ----------------
# 最大加速度（m/s²），对应满油门
max_accel: 3.0
# 最大减速度（m/s²，正值），对应满刹车
max_decel: 6.0
# 加速度变化率上限（m/s³）。0 表示不限制
max_jerk: 4.0
# 容许的最大横向加速度（m/s²）。决定过弯速度上限
max_lateral_accel: 3.0
# 最低速度（m/s）。曲率极大时不把车速压到低于此值
min_speed: 1.0

# ---------------- 控制细节 ----------------
# 前瞻时间（s）：限速按"提前这么久到达的曲率"计算
lookahead_time: 1.5
# 超速容差（m/s）：超出"限速 + 容差"才触发兜底制动
overspeed_tolerance: 0.2
# 兜底制动的超速增益（(m/s²)/(m/s)）
overspeed_gain: 2.0
# 曲率话题超时（s）：超时后按直道处理，避免直道上保持弯道限速
curvature_timeout: 0.5
# 控制频率（Hz）
publish_rate: 20.0
# 是否反转加速度指令符号（用于适配不同底层接口的正负约定）
invert_command: false
