# 激光雷达点云语义分割模块参数
# 所有值都是字符串，与节点内 declare_parameter(..., STRING) 对齐

lidar_segmentation_node:
  ros__parameters:
    # 权重
    checkpoint: "models/seg_mlp.npz"

    # CARLA 连接
    host: "127.0.0.1"
    port: "2000"
    town: ""                   # 留空沿用服务端当前地图；填了才会切图（慢且可能卡死）
    vehicle: "vehicle.tesla.model3"
    spawn_index: "0"
    traffic: "12"

    # 激光雷达（普通与语义两台必须一致，否则点对不上）
    lidar_range: "60.0"
    channels: "32"
    points_per_second: "200000"   # 与采集、训练保持同一密度；调大更密也更吃 CPU
    rotation: "20.0"
    lidar_height: "2.4"

    # 控制
    corridor_width: "1.2"      # 车身走廊半宽，米
    comfort_distance: "14.0"   # 大于这个距离全速
    stop_distance: "5.0"       # 小于这个距离刹停
    lookahead: "8.0"           # 纯跟踪预瞄距离
    max_steer: "0.6"           # 最大前轮转角，弧度
    max_speed: "8.0"           # 目标车速上限，米/秒
    free_window: "5"           # 前方余量中值滤波帧数，1 表示不过滤