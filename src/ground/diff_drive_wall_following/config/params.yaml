# 沿墙行驶参数（launch 中作为节点私有参数加载）
target_distance: 0.5          # 期望的右侧墙距离（m）
k_distance: 1.6               # 距离误差 -> 角速度的比例系数
k_align: 1.2                  # 车身与墙夹角误差 -> 角速度的比例系数
max_angular: 0.9              # 最大角速度（rad/s）
base_speed: 0.35              # 沿墙时的基础线速度（m/s）
turn_speed: 0.8               # 墙角原地转向的角速度（rad/s）
front_block_distance: 0.75    # 前方小于该距离判定为墙角（m）
front_clear_distance: 1.1     # 前方大于该距离判定转角完成（m）
control_rate: 10.0            # 控制频率（Hz）
scan_timeout: 0.5             # 激光数据超时（s），超时后停车
