[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-ca-drone"
version = "1.0.0"
description = "Neural perception-planning-control for UAV collision avoidance (course project)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "Pillow>=7.0",
    "matplotlib>=3.1",
]

[tool.setuptools.packages.find]
include = ["ca_drone*"]
