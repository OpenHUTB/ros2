name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Simulator smoke test
        run: python main.py --module sim --scene sparse
      - name: Full pipeline (no GIF)
        run: python main.py --module full --scene sparse --max-steps 120
      - name: Docs build
        run: mkdocs build
