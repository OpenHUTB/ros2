# uav_landing_monitor 默认参数
# 注意：本文件由 launch/main.launch 以 <rosparam command="load"> 载入到节点私有命名空间，
# 所以下面这些键在运行时是 /uav_landing_monitor/... （节点里读的是 ~xxx）。

topic:
  odom: /uav/odom
  cmd_vel: /uav/cmd_vel
  status: /uav/status
  goal: /uav/goal
  landing_point: /rooftop_nn/landing_point
  alert: /uav/landing_monitor/alert
  state: /uav/landing_monitor/state

frame:
  # 高度分量是否上为正（ENU）。桥接层若给 NED（下为正）就设 false。
  z_up: true

monitor:
  rate_hz: 10.0          # 判据计算频率
  state_hz: 2.0          # 状态话题发布频率
  csv: ""                # 非空则把逐帧数据写成 CSV（t,phase,z,vz_cmd,status,alerts）
  verbose: true          # 告警同时打到 rosout

target:
  # auto      : 优先用 /rooftop_nn/landing_point 的 z，其次用 /uav/goal 的 z 减去 goal_offset_m
  # landing   : 只用落点话题
  # goal_offset: 只用目标点话题（z - goal_offset_m）
  # fixed     : 只用下面的 z
  mode: auto
  # z: 15.83            # 仅 mode=fixed 时使用（不要留 null，rosparam 无法编码 None）
  goal_offset_m: 5.0     # /uav/goal 一般是“屋面上方安全高度”，减掉它才是屋面高度

thresholds:
  stale_input_s: 1.0            # 里程计超时
  cmd_min_vz: 0.15              # |vz| 小于它视为没在下降
  cmd_effect_window_s: 2.0      # 指令-运动一致性观察窗
  cmd_effect_ratio: 0.30        # 实际位移 < ratio × 期望 -> CMD_NO_EFFECT
  cmd_effect_min_expect_m: 0.15 # 期望位移太小不判，避免噪声
  descend_grace_s: 1.5          # 刚进入下降的起动宽限期（飞控要时间加速，期间不判指令无效）
  descend_stall_s: 2.0          # 状态说 DESCEND 但没指令的观察窗
  descend_stall_eps_m: 0.10
  free_fall_window_s: 0.6
  free_fall_rate: 1.2           # m/s，超过且没有对应指令 -> FREE_FALL
  free_fall_cmd_slack: 0.6
  landing_tol_m: 0.35           # 落地容差
  overshoot_m: 0.30             # 低于目标这么多 -> OVERSHOOT
  timeout_s: 90.0               # 下降超时
  alert_cooldown_s: 3.0         # 同类告警冷却
