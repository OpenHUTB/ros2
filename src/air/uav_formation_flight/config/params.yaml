# 与 AirSim 模拟器的连接参数
airsim:
  ip: "192.168.237.1"            # 宿主机 VMnet8 地址，每台机器可能不同（用 ipconfig 查看）
  timeout: 30.0                  # 单次 RPC 超时（秒）
  leader: "SimpleFlight"         # 长机载具名（OpenHUTB 默认载具）
  followers: ["SimpleFlight2", "SimpleFlight3"]   # 僚机载具名，与 settings.json 一致

# 飞行与编队参数（长度：米；速度：米/秒）
flight:
  control_rate: 20.0             # 控制与采样频率（Hz）
  takeoff_altitude: 3.0          # 起飞后稳定悬停的高度（相对起飞点）
  takeoff_interval: 1.0          # 三架依次起飞的时间间隔（秒），避免地面相互干涉
  max_speed: 2.0                 # 水平速度上限
  max_vertical_speed: 1.0        # 垂直速度上限
  cmd_duration: 0.10             # 每条速度指令的有效期（秒），保持与控制周期同量级即可。
                                 # 注：lag_probe 实测 0.5 s 与 0.05 s 两种时长的回路延迟
                                 # 都是 0.65 s，延迟来自 AirSim 内部速度跟踪，不是这个参数。
  altitude_mode: velocity        # 高度通道下发方式：
                                 #   velocity  = 三维速度全交给我们的 PID（moveByVelocityAsync，
                                 #               默认，实测执行机构响应 71%，与 1 秒上升时间吻合）；
                                 #   setpoint  = 只下发水平速度 + 高度设定值（moveByVelocityZAsync）。
                                 # 实测 setpoint 模式在这个构建里是坏的：指令 0.5 m/s 的横向速度
                                 # 会跑出 0.85~1.43 m/s（171%~286%），所以不要用。
  leader_velocity_ff: 0.5        # 僚机的前馈增益：叠加长机速度（经 0.3 秒低通），抵消追赶
                                 # 移动目标的固有滞后。设 0 即退回纯反馈。
  leader_velocity_ff_tau: 0.3    # 前馈速度的低通时间常数（秒）：长机速度里的抖动不要整幅
                                 # 灌进僚机指令；调小更跟手、调大更平顺。
  leader_ref_speed: 0.7          # 长机引导点沿航点折线的推进速度（米/秒）。航点改用
                                 # 限速引导点而不是阶跃指令：0.65 秒执行延迟 + kp=1.0
                                 # 的阶跃响应会过冲成极限环（来回摆、高度被顶高约 1 米、
                                 # 撞路灯并互相碰撞），单机测试证明增益本身是稳的。
  collision_check_every: 5       # 每几拍查一次碰撞（simGetCollisionInfo，0 = 关闭）
  waypoint_tolerance: 0.25       # 长机判定“到达航点”的球半径
  formation_tolerance: 0.30      # 判定“队形保持”的球半径（队形误差）
  waypoint_timeout: 25.0         # 单个航点超时（秒）
  settle_time: 1.0               # 到达后继续悬停的时间，用于统计稳态误差（秒）
  deploy_timeout: 30.0           # 单架展开到队形空位的等待上限（秒）
  deploy_offset: [0.0, 0.0]      # 展开阶段的额外水平偏移（ENU 米），一般留 0
  alt_separation: 3.0            # 展开阶段相邻两架的垂直间隔（米）。三架从同一坐标
                                 # 起飞，按「先起飞的飞更高」的方式分层，后一架就不会
                                 # 穿过先起飞的。间隔要留够：这个载具机身约 1.5 米，
                                 # 2.0 米时两架的桨叶会交叠（录像里两架像叠在一起）。
  leader_clear_offset: [2.5, 0.0]  # 长机展开时先沿马路方向（ENU x）让开的距离（米）。
                                 # 三架同点起飞，长机让开柱子，僚机才能安全起降；
                                 # 沿马路横飞不经过行道树，往 ±y 横飞会撞树冠（实测）。
  reset_on_start: true           # 每次运行前重置关卡，保证三架从同一起点起飞
                                 # （否则它们从上一轮散落的地面位置起飞，展开会互相穿柱）
  deploy_mode: position          # 展开阶段怎么就位：position = AirSim 自带位置控制
                                 # （默认，展开只是布场，稳定第一）；pid = 我们自己的
                                 # 速度环（对比用）。实测 pid 模式在 SimpleFlight2 上会
                                 # 绕圈不收敛，同样的增益在另外两架上却很好。
  max_duration: 150.0            # 单次任务总时长上限（秒）；到点自动收尾，避免不结束

# PID 增益（位置误差 -> 速度指令）
pid:
  kp: 0.4                        # 注意：launch/main.launch 里的 kp/ki/kd 会【覆盖】本文件，
  ki: 0.02                       # 改增益要两处一起改，或在命令行传 kp:=0.4 ki:=0.02 kd:=0.05。
  kd: 0.05                       # 单机时 kp=1.0 是稳的（稳态 RMS 0.026 米），三架同时飞时
                                 # 回路会满幅振荡；降增益是为了给 0.65 秒延迟留相位余量。
  integral_limit: 1.0            # 积分限幅，抗积分饱和

# 队形定义：每个僚机相对长机的期望偏移，单位米，ROS ENU 坐标（x 向东、y 向北、z 向上）
# 顺序与 airsim/followers 一一对应
shapes:
  line:                          # 一字横队：左右各 3 米
    - [0.0, -3.0, 0.0]
    - [0.0,  3.0, 0.0]
  triangle:                      # 等边三角形：边长 3 米，长机为前顶点
    - [0.0, -3.0, 0.0]
    - [-2.6, 1.5, 0.0]
  column:                        # 纵队：长机正后 3 米 / 6 米
    - [0.0, -3.0, 0.0]
    - [0.0, -6.0, 0.0]
  column_x:                      # 沿航向纵队：长机正后 3 米 / 6 米（x 方向）。
                                 # 这是本街道的推荐演示队形：三架全程压在马路中线上。
                                 # 左右各 3 米的一字横队在这条街上余量不足 —— 路两侧
                                 # 4~6 米高处是灯柱和行道树，僚机离它们只有约 1 米。
    - [-3.0, 0.0, 0.0]
    - [-6.0, 0.0, 0.0]

# 任务：leader 为长机航点序列（相对起飞点的 ENU 坐标）
#       schedule 为「在长机第 N 个航点起切换到某队形」的时刻表
missions:
  line_straight:                 # 一字横队直线巡航
    schedule: [[line, 0]]
    leader:
      - [0.0,  0.0, 3.0]
      - [3.0,  0.0, 3.0]
      - [6.0,  0.0, 3.0]
      - [9.0,  0.0, 3.0]
      - [12.0, 0.0, 3.0]

  column_straight:               # 纵队直线巡航（演示与录屏推荐用这个）
    schedule: [[column_x, 0]]
    leader:
      - [0.0,  0.0, 3.0]
      - [3.0,  0.0, 3.0]
      - [6.0,  0.0, 3.0]
      - [9.0,  0.0, 3.0]
      - [12.0, 0.0, 3.0]

  triangle_circle:               # 三角形编队绕半径 6 米的圆飞行
    schedule: [[triangle, 0]]
    leader:
      - [6.0,  0.0,    3.0]
      - [5.2,  3.0,    3.0]
      - [3.0,  5.2,    3.0]
      - [0.0,  6.0,    3.0]
      - [-3.0, 5.2,    3.0]
      - [-5.2, 3.0,    3.0]
      - [-6.0, 0.0,    3.0]
      - [-5.2, -3.0,   3.0]
      - [-3.0, -5.2,   3.0]
      - [0.0,  -6.0,   3.0]
      - [3.0,  -5.2,   3.0]
      - [5.2,  -3.0,   3.0]

  switch_shape:                  # 横队 -> 三角 -> 纵队 动态切换
    schedule: [[line, 0], [triangle, 4], [column, 8]]
    leader:
      - [0.0,  0.0, 3.0]
      - [1.5,  0.0, 3.0]
      - [3.0,  0.0, 3.0]
      - [4.5,  0.0, 3.0]
      - [6.0,  0.0, 3.0]
      - [7.5,  0.0, 3.0]
      - [9.0,  0.0, 3.0]
      - [10.5, 0.0, 3.0]
      - [12.0, 0.0, 3.0]
      - [13.5, 0.0, 3.0]
      - [15.0, 0.0, 3.0]
      - [16.5, 0.0, 3.0]
