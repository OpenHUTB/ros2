# CarlaAir / AirSim 桥接配置
# 模拟器跑在 Windows 宿主机（有显卡），ROS 侧跑在 Ubuntu 虚拟机里。
# 从虚拟机连宿主机：下方 host 填宿主机在 VMware NAT 网段的地址（VMnet8 = 192.168.94.1）。

sim:
  host: "192.168.94.1"      # 运行 CarlaAir 的机器 IP；本机运行时填 127.0.0.1
  airsim_port: 41451        # AirSim API（无人机、相机、激光雷达）
  carla_port: 2000          # CARLA API（车辆、行人、天气、CARLA 原生 LiDAR）
  vehicle_name: ""          # 多机时填具体名称，如 "Drone1"
  connect_timeout: 10.0     # 连接等待秒数

rate:
  odom_hz: 20.0             # 位姿发布频率
  image_hz: 20.0            # 相机发布频率（三路图像合并为一次 RPC）
  lidar_hz: 10.0            # 点云发布频率（与 settings.json 的 RotationsPerSecond 一致）
  cmd_timeout: 0.5          # 超过该时间没有新指令则悬停（安全保护）

sensor:
  lidar_name: "lidar1"                        # settings.json 中的雷达名
  lidar_frame: "vehicle_inertial"             # 与 settings.json 的 DataFrame 保持一致

lidar:
  min_range: 0.3            # 环形滤波最小距离 m（0 = 不启用）
  max_range: 60.0           # 环形滤波最大距离 m（0 = 不启用）
  voxel_leaf: 0.0           # 体素降采样边长 m（0 = 不降采样）

camera:
  rgb_name: "front_rgb"     # settings.json 中的相机名
  depth_name: "front_depth"
  seg_name: "front_seg"
  publish_rgb: true
  publish_depth: true
  publish_seg: false        # 分割图默认关闭，需要做语义感知时再打开

frame:
  world: "world"            # 世界坐标系（ENU）
  body: "base_link"         # 机体坐标系

topic:
  odom: "/uav/odom"
  cmd_vel: "/uav/cmd_vel"
  goal: "/uav/goal"
  image: "/camera/image_raw"
  depth: "/camera/depth"
  seg: "/camera/seg"
  lidar: "/lidar/points"
  status: "/uav/status"

control:
  max_horiz_speed: 5.0      # 水平限速 m/s
  max_vert_speed: 3.0       # 垂直限速 m/s
  max_yaw_rate: 1.0         # 偏航角速度限幅 rad/s
