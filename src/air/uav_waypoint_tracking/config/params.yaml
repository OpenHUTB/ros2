# 与 AirSim 模拟器的连接参数
airsim:
  ip: "192.168.237.1"        # 宿主机 VMnet8 地址，每台机器可能不同（用 ipconfig 查看）
  vehicle_name: "Drone1"
  timeout: 10.0

# 飞行参数（长度单位：米；高度按 ROS 习惯，Z 轴向上为正）
flight:
  takeoff_altitude: 3.0      # 起飞后稳定悬停的高度
  waypoint_tolerance: 0.25   # 判定“到达航点”的球半径
  control_rate: 20.0         # PID 控制频率（Hz）
  max_speed: 2.0             # 水平速度上限，抑制超调
  max_vertical_speed: 1.0    # 垂直速度上限
  waypoint_timeout: 20.0     # 单个航点超时（秒）
  settle_time: 1.0           # 到达后继续稳定悬停的时间（秒），用于统计稳态误差

# PID 增益（第一组：手动整定后的推荐值）
pid:
  kp: 1.0
  ki: 0.05
  kd: 0.2
  integral_limit: 1.0        # 积分限幅，抗积分饱和

# 航点序列（ROS ENU 坐标：x 向东、y 向北、z 向上）
missions:
  hover_step:                # 单点阶跃：观察 PID 整定效果
    - [1.5,  0.0, 3.0]
  rectangle:                 # 矩形四角 + 返回原点
    - [2.0,  2.0, 3.0]
    - [2.0, -2.0, 3.0]
    - [-2.0, -2.0, 3.0]
    - [-2.0,  2.0, 3.0]
    - [0.0,  0.0, 3.0]
  spiral:                    # 螺旋上升：同时考验水平与高度控制
    - [1.00,  0.00, 3.0]
    - [0.65,  1.13, 3.5]
    - [-0.80, 1.39, 4.0]
    - [-1.90, 0.00, 4.5]
    - [-1.10, -1.91, 5.0]
    - [1.25, -2.18, 5.5]
    - [0.00,  0.00, 3.0]