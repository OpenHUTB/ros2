# 全局 + 局部代价地图参数（无人机 2D 投影导航）
footprint: [[0.35, 0.35], [0.35, -0.35], [-0.35, -0.35], [-0.35, 0.35]]
robot_radius: 0.35
transform_tolerance: 1.0

global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 2.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 30.0
  height: 30.0
  resolution: 0.1
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    observation_sources: scan
    scan:
      sensor_frame: base_link
      topic: /scan
      data_type: LaserScan
      marking: true
      clearing: true
      obstacle_range: 20.0
      raytrace_range: 25.0
      expected_update_rate: 2.0
  inflation_layer:
    inflation_radius: 1.2
    cost_scaling_factor: 3.0

local_costmap:
  global_frame: world
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 5.0
  rolling_window: true
  width: 12.0
  height: 12.0
  resolution: 0.1
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    observation_sources: scan
    scan:
      sensor_frame: base_link
      topic: /scan
      data_type: LaserScan
      marking: true
      clearing: true
      obstacle_range: 8.0
      raytrace_range: 10.0
      expected_update_rate: 2.0
  inflation_layer:
    inflation_radius: 0.8
    cost_scaling_factor: 4.0
