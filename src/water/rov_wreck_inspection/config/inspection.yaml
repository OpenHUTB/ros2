# 沉船巡检参数
# 沉船沿 X 轴横卧于原点，ROV 沿其外侧椭圆轨迹环绕巡检

wreck_center: [0.0, 0.0]      # 沉船中心（世界坐标，米）
orbit_a: 6.6                  # 巡检椭圆 X 半轴（米）
orbit_b: 3.6                  # 巡检椭圆 Y 半轴（米）
orbit_z: -3.6                 # 巡检高度（米）
speed: 0.45                   # 环航线速度（米/秒）
hold_time: 3.5                # 每个采样点停留时间（秒）
confirm_time: 0.6             # 视觉确认所需的连续识别时间（秒）
marker_size: 0.55             # 结构标记板边长（米），用于单目测距
camera_hfov: 1.22             # 相机水平视场角（弧度）
loop: true                    # 一圈结束后是否继续

# 采样点：t 为椭圆参数角（弧度），由标记板在世界坐标中的径向方向反算得到
# 采样点坐标 = (a*cos(t), b*sin(t), orbit_z)
sample_points:
  - {name: "S1", t: 0.559}
  - {name: "S2", t: 2.583}
  - {name: "S3", t: 3.700}
  - {name: "S4", t: 5.724}

start_t: 0.0                  # 起始椭圆参数角
