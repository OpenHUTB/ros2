# 水下 ROV 定深控制模块参数
#
# 说明：
#   - 机体质量 = hull_mass + 尾鳍(体积 × 密度)，默认 15.0 + 1.6 = 16.6 kg，运行时会打印实测值
#   - 净浮力 = 机体质量 × 9.81 × buoyancy_ratio（2% 正浮力，模拟真实配平偏差）
#   - 控制频率 = 1 / (control.dt × control.control_every) = 1 / (0.002 × 25) = 20 Hz

model:
  size: [0.40, 0.30, 0.30]     # 机体尺寸 m
  hull_mass: 15.0              # 机体（壳体）质量 kg
  fin:                         # 尾鳍：显式体现在配置里，避免"改了质量却对不上"
    size: [0.40, 0.04, 0.20]   # 尾鳍尺寸 m
    density: 500.0             # 尾鳍密度 kg/m^3（体积 0.0032 m^3 -> 1.6 kg）
  buoyancy_ratio: 1.02         # 净浮力系数（1.0 = 中性浮力）
  drag_linear: 12.0            # 线性阻尼 N/(m/s)
  drag_quadratic: 25.0         # 二次阻尼 N/(m/s)^2
  max_thrust: 80.0             # 垂向推进器最大推力 N
  forward_thrust: 6.0          # 水平推进器推力 N（保持巡航）

control:
  dt: 0.002                    # 物理步长 s
  control_every: 25            # 每 25 个物理步更新一次控制 -> 20 Hz
  position_gain: 0.8           # 位置误差 -> 期望垂速（1/s）
  velocity_gain: 4.0           # 垂速误差 -> 期望加速度（1/s）
  max_vertical_speed: 1.0      # 期望垂速限幅 m/s

mission:
  # (目标深度 m, 保持时长 s)
  segments:
    - [-5.0, 14.0]
    - [-2.0, 14.0]
    - [-0.5, 14.0]
  settle_time: 4.0             # 判定稳态误差时只看每段最后这么多秒
  pass_threshold: 0.05         # PASS 阈值 m（实测最差 1.3 cm，留 5 cm 余量）

output:
  save_dir: "docs"
