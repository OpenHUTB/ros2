mujoco_musculoskeletal_knee_tracking_node:
  ros__parameters:
    # 模型路径一般由包内自动定位, 如需覆盖可取消注释
    # model_path: /path/to/muscle_knee.xml

    sim:
      dt: 0.005                    # 仿真步长 [s]
      duration: 30.0               # 内置轨迹仿真时长 [s]
      exit_after_duration: false   # true: 内置轨迹跑完后节点自动退出

    trajectory:
      type: sine         # sine | step
      amplitude_deg: 40.0
      frequency_hz: 0.4
      bias_deg: 30.0

    ctrl:
      kp: 30.0             # 比例增益 [N·m/rad]
      kd: 3.0              # 微分增益 [N·m·s/rad]
      # 模型实际最大关节力矩 = 单肌最大力 500 N × wrap 半径 0.035 m = 17.5 N·m
      max_torque: 17.5     # 肌肉等效最大力矩 [N·m] (激活归一化分母)
      limit_deg: 90.0      # 屈曲上限 [deg]
      limit_low_deg: -15.0 # 伸展下限 [deg]
