[develop]
script_dir=$base/lib/humanoid_knee_impedance
[install]
install_scripts=$base/lib/humanoid_knee_impedance
[tool:pytest]
# 禁用 typeguard 插件：部分环境（如 ~/.local 下自装的旧版 typeguard）
# 与系统 pytest 的 argparsing API 不兼容，会在收集阶段直接抛 AssertionError，
# 导致 colcon test 一项都跑不到。禁用后测试可在干净环境直接复现。
addopts = -p no:typeguard
