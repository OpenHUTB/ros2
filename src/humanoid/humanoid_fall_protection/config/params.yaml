# 人形机器人跌倒预判与保护性倒地 —— ROS2 参数
# ============================================
# 只有 `/fall_protection_node` 一节：launch 把这个文件整体传给节点，
# 节点名必须与节的键完全一致，否则参数不会生效（ROS2 按节点全名匹配）。
#
# 倾角 30° 取自 OpenHorizon Labs 的 Asimov 1 safe-fall 部署配置（Apache-2.0），
# 他们的训练范围是倾角 20°~45°、角速度 2~4 rad/s。
# 角速度这里用 3.0 而不是他们的 2.0：那个值是在行走状态下整定的，站立时被推
# 一下，躯干瞬时角速度就能到 2 rad/s 而机器人其实站得住（150 N 实测如此）。
# 取 3.0 之后 150 N 不触发、200 N 触发，误触发与漏检的平衡点在 180 N 附近。

/fall_protection_node:
  ros__parameters:
    # --- 仿真 ---
    sim_rate: 500.0            # 物理步进频率 (Hz)，等于模型 timestep 的倒数
    publish_rate: 30.0         # 话题发布频率 (Hz)
    model_path: ""             # 留空则用包内 models/humanoid_fall.xml

    # --- 跌倒判据 ---
    tilt_threshold_deg: 30.0   # 躯干倾角阈值 (deg)
    tilt_rate_threshold: 3.0   # 躯干倾角速率阈值 (rad/s)，见下方说明
    detector_mode: "or"        # "or" 任一满足即触发；"and" 同时满足才触发

    # --- 保护动作 ---
    protect_enable: true
    protect_kp: 1200.0         # 保护阶段的关节比例增益 (N·m/rad)
    protect_kv: 60.0           # 保护阶段的关节微分增益 (N·m·s/rad)
    protect_direction: "auto"  # auto / forward / backward

    # --- 扰动 ---
    push_force: 300.0          # 推扰力 (N)，正值为向前推（人向前扑）
    push_duration: 0.08        # 持续时间 (s)
    push_delay: 1.0            # 起始时刻 (s)

    # --- 运行 ---
    strategy: "protect"        # rigid / limp / protect，可在运行时通过话题切换

/fall_protection_teleop:
  ros__parameters:
    # 预留：如果有遥控节点从这个文件读参数，放在这一节，不要把键混进上面的节点
    step: 20.0
