# 柔顺实验配置：外力施加方式与刚度扫描点
#
# 外力作用在手腕而不是躯干——躯干受力会直接挑战全身平衡，几十牛的方波就能把
# 34 kg 的 G1 推倒；手腕受力才是「人手接触、机器人柔顺让位」的场景，躯干基本不动。

perturbation:
  body: left_wrist_roll_rubber_hand   # 左腕橡胶手（末端执行器）
  axis: y                             # 世界坐标；y 为侧向，正负号即方向
  force_n: 6.0                        # 实测 6 N 时各刚度均稳定，15 N 时低刚度会失稳
  settle_s: 3.0                       # 施力前先站稳
  duration_s: 2.0                     # 持续施力，用于测稳态让位
  after_s: 2.5                        # 撤销后观察恢复

# 刚度扫描点（K_lin_la）。150 以上等效末端刚度饱和在 ~298 N/m
stiffness_sweep: [30, 55, 80, 110, 150, 250, 500]

defaults:
  stiffness: [250.0, 250.0, 250.0, 55.0, 55.0]
  base_height_m: 0.74
