name: 肘关节动图复现校验

on:
  pull_request:
    paths:
      - "src/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/**"
      - "docs/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control.md"
      - "docs/img/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/**"
      - ".github/workflows/musculoskeletal_elbow_demo.yml"
  push:
    paths:
      - "src/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/**"
      - "docs/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control.md"
      - "docs/img/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/**"
      - ".github/workflows/musculoskeletal_elbow_demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: 复现动图并校验文档资源
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control
    steps:
      - name: 获取模块与文档资源
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/
            /docs/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control.md
            /docs/img/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/requirements.txt
            src/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/requirements-demo.txt
      - name: 安装录制与文档校验依赖
        run: |
          python -m pip install -r src/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/requirements-demo.txt
          python -m pip install mkdocs==1.6.1 python-markdown-math
      - name: 从模型重新录制动图
        run: |
          python src/musculoskeletal/mujoco_musculoskeletal_elbow_nn_control/tools/record_gif.py --output "$RUNNER_TEMP/elbow-reproduced.gif"
      - name: 校验动图时长、文档链接和严格构建
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from html.parser import HTMLParser
          from urllib.parse import unquote, urlsplit

          from PIL import Image
          import yaml

          root = Path.cwd()
          module_name = "mujoco_musculoskeletal_elbow_nn_control"
          doc_relative = Path("musculoskeletal") / f"{module_name}.md"
          asset_relative = Path("img/musculoskeletal") / module_name / "elbow_trajectory.gif"
          doc = root / "docs" / doc_relative
          asset = root / "docs" / asset_relative
          reproduced = Path(os.environ["RUNNER_TEMP"]) / "elbow-reproduced.gif"

          def check_gif(path):
              durations = []
              hashes = set()
              with Image.open(path) as image:
                  assert image.format == "GIF", f"不是 GIF 文件：{path}"
                  assert image.size == (700, 500), f"动图尺寸不正确：{image.size}"
                  assert image.n_frames == 200, f"动图应为 200 帧：{image.n_frames}"
                  assert image.info.get("loop") == 0, "动图应循环播放"
                  for index in range(image.n_frames):
                      image.seek(index)
                      image.load()
                      durations.append(image.info.get("duration", 0))
                      hashes.add(hashlib.sha256(image.convert("RGB").tobytes()).hexdigest())
              assert set(durations) == {20}, f"每帧应为 20 毫秒：{set(durations)}"
              assert sum(durations) == 4000, f"播放时长应为 4 秒：{sum(durations)} 毫秒"
              assert len(hashes) > 1, "动图帧内容未变化"
              assert 0 < path.stat().st_size < 5 * 1024 * 1024, "动图应小于 5 MiB"
              return {"path": str(path), "frames": len(durations), "duration_ms": sum(durations), "size": [700, 500]}

          results = [check_gif(asset), check_gif(reproduced)]
          markdown = doc.read_text(encoding="utf-8")
          expected_link = f"../img/musculoskeletal/{module_name}/elbow_trajectory.gif"
          matches = re.findall(r"!\[MuJoCo 肘关节轨迹与肌腱力回放\]\(([^)]+)\)", markdown)
          assert matches == [expected_link], f"动图引用应使用模块子目录：{matches}"
          assert (doc.parent / matches[0]).resolve() == asset.resolve(), "Markdown 图片链接未指向素材"

          class ImageSources(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "img" and attrs.get("alt") == "MuJoCo 肘关节轨迹与肌腱力回放":
                      self.sources.append(attrs.get("src", ""))

          with tempfile.TemporaryDirectory(prefix="elbow-docs-") as directory:
              fixture = Path(directory)
              fixture_doc = fixture / "docs" / doc_relative
              fixture_asset = fixture / "docs" / asset_relative
              fixture_doc.parent.mkdir(parents=True)
              fixture_asset.parent.mkdir(parents=True)
              shutil.copy2(doc, fixture_doc)
              shutil.copy2(asset, fixture_asset)
              config = fixture / "mkdocs.yml"
              config.write_text(yaml.safe_dump({
                  "site_name": "肘关节动图校验",
                  "docs_dir": "docs",
                  "site_dir": "site",
                  "nav": [{"肘关节": doc_relative.as_posix()}],
                  "markdown_extensions": ["fenced_code", "tables", "mdx_math"],
              }, allow_unicode=True), encoding="utf-8")
              subprocess.run([sys.executable, "-m", "mkdocs", "build", "--strict", "--config-file", str(config)], check=True)
              html = fixture / "site/musculoskeletal" / module_name / "index.html"
              parser = ImageSources()
              parser.feed(html.read_text(encoding="utf-8"))
              assert len(parser.sources) == 1, f"页面应有一张对应动图：{parser.sources}"
              target = (html.parent / unquote(urlsplit(parser.sources[0]).path)).resolve()
              assert target == (fixture / "site" / asset_relative).resolve(), "构建后图片路径未正确改写"
              assert target.is_file(), "构建产物缺少动图文件"
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY
      - name: 保存重新录制的动图
        uses: actions/upload-artifact@v4
        with:
          name: elbow-reproduced-gif
          path: ${{ runner.temp }}/elbow-reproduced.gif
          retention-days: 7