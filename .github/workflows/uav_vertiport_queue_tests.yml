name: uav_vertiport_queue tests

on:
  push:
    paths:
      - 'src/air/uav_vertiport_queue/**'
      - '.github/workflows/uav_vertiport_queue_tests.yml'
  pull_request:
    paths:
      - 'src/air/uav_vertiport_queue/**'
      - '.github/workflows/uav_vertiport_queue_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pyyaml pytest

      - name: Run module tests (offline, no ROS)
        working-directory: src/air/uav_vertiport_queue
        run: bash tools/ci_tests.sh
