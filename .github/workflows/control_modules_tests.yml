name: control modules tests

# 五个纯计算模块的构建与单元测试：不依赖仿真器，几分钟内跑完。
# 覆盖 can_signal_decode / control_discretization / drivetrain_torsion_state_feedback
# / wheel_speed_observer / uav_hover_throttle。
on:
  push:
    paths:
      - 'src/ground/can_signal_decode/**'
      - 'src/ground/control_discretization/**'
      - 'src/ground/drivetrain_torsion_state_feedback/**'
      - 'src/ground/wheel_speed_observer/**'
      - 'src/air/uav_hover_throttle/**'
      - '.github/workflows/control_modules_tests.yml'
  pull_request:
    paths:
      - 'src/ground/can_signal_decode/**'
      - 'src/ground/control_discretization/**'
      - 'src/ground/drivetrain_torsion_state_feedback/**'
      - 'src/ground/wheel_speed_observer/**'
      - 'src/air/uav_hover_throttle/**'
      - '.github/workflows/control_modules_tests.yml'

jobs:
  test:
    name: colcon build + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Build the five packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select \
            can_signal_decode \
            control_discretization \
            drivetrain_torsion_state_feedback \
            wheel_speed_observer \
            uav_hover_throttle

      - name: Run unit tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --packages-select \
            can_signal_decode \
            control_discretization \
            drivetrain_torsion_state_feedback \
            wheel_speed_observer \
            uav_hover_throttle
          colcon test-result --verbose
