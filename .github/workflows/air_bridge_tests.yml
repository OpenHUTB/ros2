name: Air bridge tests

on:
  push:
    paths:
      - 'src/air/carlair_ros_bridge/**'
      - 'src/air/uav_airsim_keyboard/**'
      - 'src/air/uav_bc_bench/**'
      - 'src/air/uav_landing_monitor/**'
      - 'src/air/uav_keyboard_control/**'
      - 'src/air/uav_e2e_rl/**'
      - 'src/air/airsim_ros2_magnetometer/**'
      - '.github/workflows/air_bridge_tests.yml'
  pull_request:
    paths:
      - 'src/air/carlair_ros_bridge/**'
      - 'src/air/uav_airsim_keyboard/**'
      - 'src/air/uav_bc_bench/**'
      - 'src/air/uav_landing_monitor/**'
      - 'src/air/uav_keyboard_control/**'
      - 'src/air/uav_e2e_rl/**'
      - 'src/air/airsim_ros2_magnetometer/**'
      - '.github/workflows/air_bridge_tests.yml'

jobs:
  test:
    name: Local tests (no ROS / simulator)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip numpy pyyaml pytest

      - name: Run bridge tests
        run: |
          python3 tests/test_frames.py
          python3 tests/test_bridge_local.py
          python3 tests/test_sensors_local.py
          if [ -f tests/test_imu_local.py ]; then
            python3 tests/test_imu_local.py
          fi

      - name: Run uav_landing_monitor tests
        run: python3 src/air/uav_landing_monitor/tests/test_uav_landing_monitor_local.py

      - name: Byte-compile keyboard scripts
        run: python3 -m py_compile src/air/uav_keyboard_control/uav_keyboard_control/*.py src/air/uav_keyboard_control/test/*.py src/air/uav_keyboard_control/launch/*.py src/air/uav_keyboard_control/setup.py

      - name: Run uav_keyboard_control tests
        run: python3 src/air/uav_keyboard_control/test/test_keyboard_local.py

      - name: Byte-compile e2e_rl scripts
        run: python3 -m py_compile src/air/uav_e2e_rl/uav_e2e_rl/*.py src/air/uav_e2e_rl/test/*.py src/air/uav_e2e_rl/launch/*.py src/air/uav_e2e_rl/setup.py

      - name: Run uav_e2e_rl tests
        run: python3 src/air/uav_e2e_rl/test/test_e2e_logic_local.py

      - name: Run uav_bc_bench tests
        run: python3 -m pytest src/air/uav_bc_bench/test -q

      - name: Run uav_airsim_keyboard tests
        run: python3 -m pytest src/air/uav_airsim_keyboard/test -q

      - name: Byte-compile air scripts
        run: |
          python3 -m py_compile src/air/carlair_ros_bridge/scripts/*.py

      - name: Byte-compile landing monitor scripts
        run: python3 -m py_compile src/air/uav_landing_monitor/scripts/*.py src/air/uav_landing_monitor/tools/*.py

  magnetometer:
    name: ROS 2 Humble magnetometer build + tests
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pytest

      - name: Build magnetometer package
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --packages-select airsim_ros2_magnetometer \
            --event-handlers console_direct+

      - name: Run magnetometer tests
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test \
            --packages-select airsim_ros2_magnetometer \
            --return-code-on-test-failure \
            --event-handlers console_direct+
          colcon test-result --verbose
