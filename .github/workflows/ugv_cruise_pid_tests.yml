name: ugv_cruise_pid tests

on:
  push:
    paths:
      - "src/ground/ugv_cruise_pid/**"
      - ".github/workflows/ugv_cruise_pid_tests.yml"
  pull_request:
    paths:
      - "src/ground/ugv_cruise_pid/**"
      - ".github/workflows/ugv_cruise_pid_tests.yml"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/ground/ugv_cruise_pid/requirements.txt pytest
      - name: Run tests
        working-directory: src/ground/ugv_cruise_pid
        run: python -m pytest tests -v
      - name: Run simulation
        working-directory: src/ground/ugv_cruise_pid
        run: python main.py --out-dir results
      - name: Check artifacts
        working-directory: src/ground/ugv_cruise_pid
        run: |
          test -s results/cruise_response.png
          test -s results/cruise_demo.gif
          test -s results/summary.json
          python - <<'PY'
          import json
          d = json.load(open("results/summary.json", encoding="utf-8"))
          m = d["metrics"]
          assert m["steady_err"] < 0.2, m
          assert m["rise_time"] is not None, m
          print("metrics ok:", m)
          PY
