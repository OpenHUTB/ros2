name: muscle_synergy_lab tests

# 只跑本模块：13 项单元测试 + 语法检查 + CLI 三张表。
# 纯 numpy，不需要 ROS 2、不需要 EMG 数据。

on:
  push:
    paths:
      - "src/musculoskeletal/muscle_synergy_lab/**"
      - "docs/musculoskeletal/muscle_synergy_lab.md"
      - ".github/workflows/muscle_synergy_lab_tests.yml"
  pull_request:
    paths:
      - "src/musculoskeletal/muscle_synergy_lab/**"
      - "docs/musculoskeletal/muscle_synergy_lab.md"
      - ".github/workflows/muscle_synergy_lab_tests.yml"

jobs:
  test:
    name: unittest + cli (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install numpy
        run: python -m pip install "numpy>=1.20"

      - name: Unit tests
        working-directory: src/musculoskeletal/muscle_synergy_lab
        run: python -m unittest discover -s test -p "test_*.py" -v

      - name: Syntax check
        working-directory: src/musculoskeletal/muscle_synergy_lab
        run: python -m compileall -q muscle_synergy_lab launch tools main.py

      - name: Figures (matplotlib, optional dep)
        working-directory: src/musculoskeletal/muscle_synergy_lab
        shell: bash
        run: |
          python -m pip install "matplotlib>=3.5"
          python tools/make_figures.py --out build_figs
          ls -l build_figs

      - name: CLI tables
        working-directory: src/musculoskeletal/muscle_synergy_lab
        run: python main.py
