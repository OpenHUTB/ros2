name: chap9 lidar_intensity_traversability tests

on:
  push:
    paths:
      - 'src/chap9/lidar_intensity_traversability/**'
      - '.github/workflows/chap9_lidar_intensity_traversability_tests.yml'
  pull_request:
    paths:
      - 'src/chap9/lidar_intensity_traversability/**'
      - '.github/workflows/chap9_lidar_intensity_traversability_tests.yml'

jobs:
  unit-tests:
    name: pytest (no ROS, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest
      - name: Run unit tests
        env:
          PYTHONPATH: src/chap9/lidar_intensity_traversability
        run: python3 -m pytest src/chap9/lidar_intensity_traversability/test -q
