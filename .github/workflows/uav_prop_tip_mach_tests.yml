name: Prop tip Mach tests

on:
  push:
    paths:
      - 'src/air/uav_prop_tip_mach/**'
      - '.github/workflows/uav_prop_tip_mach_tests.yml'
  pull_request:
    paths:
      - 'src/air/uav_prop_tip_mach/**'
      - '.github/workflows/uav_prop_tip_mach_tests.yml'

jobs:
  test:
    name: Prop tip Mach tests (no ROS / simulator)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/air/uav_prop_tip_mach
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install test dependency
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python3 -m pytest test -v

      - name: Run main.py smoke test
        run: |
          python3 main.py --output "${RUNNER_TEMP}/prop_out"
          test -s "${RUNNER_TEMP}/prop_out/report.json"

      # 模拟 Windows 中文控制台：单位全为 ASCII，不得崩溃
      - name: Run main.py with GBK stdout
        env:
          PYTHONIOENCODING: gbk
        run: python3 main.py --output "${RUNNER_TEMP}/prop_gbk"

      - name: Byte-compile the module
        run: python3 -m py_compile main.py uav_prop_tip_mach/*.py launch/main.launch.py

  windows:
    name: Windows smoke test (GBK stdio)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/air/uav_prop_tip_mach
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest test -v

      - name: Run main.py with GBK stdout
        env:
          PYTHONIOENCODING: gbk
        run: python main.py --output "$env:TEMP/prop_out"
