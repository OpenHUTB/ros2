name: brake_load_transfer tests

# 只跑本模块：18 项单元测试 + 语法检查 + CLI 全表输出。
# 纯 numpy，不需要 ROS 2 与任何仿真器，两个平台都能跑。

on:
  push:
    paths:
      - "src/ground/brake_load_transfer/**"
      - "docs/ground/brake_load_transfer.md"
      - ".github/workflows/brake_load_transfer_tests.yml"
  pull_request:
    paths:
      - "src/ground/brake_load_transfer/**"
      - "docs/ground/brake_load_transfer.md"
      - ".github/workflows/brake_load_transfer_tests.yml"

jobs:
  test:
    name: unittest + cli (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install numpy
        run: python -m pip install "numpy>=1.20"

      - name: Unit tests
        working-directory: src/ground/brake_load_transfer
        run: python -m unittest discover -s test -p "test_*.py" -v

      - name: Syntax check
        working-directory: src/ground/brake_load_transfer
        run: python -m compileall -q brake_load_transfer launch tools main.py

      - name: CLI full table
        working-directory: src/ground/brake_load_transfer
        run: python main.py --all
