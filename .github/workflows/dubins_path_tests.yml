name: Dubins 曲线模块测试

# 算法层只用标准库 math，不依赖 ROS；可视化层依赖 pygame，
# 这里用 SDL_VIDEODRIVER=dummy 在无显示设备的 runner 上跑离屏录制，
# 同时验证 setup.py 的打包清单（requirements.txt 等文件必须真实存在）。

on:
  push:
    paths:
      - 'src/ground/dubins_path/**'
      - 'docs/ground/dubins_path.md'
      - '.github/workflows/dubins_path_tests.yml'
  pull_request:
    paths:
      - 'src/ground/dubins_path/**'
      - 'docs/ground/dubins_path.md'
      - '.github/workflows/dubins_path_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 单元测试 + 离屏录制冒烟
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/ground/dubins_path

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pillow pyyaml pytest

      - name: Run unit tests (pytest)
        run: python -m pytest test -v

      - name: Run unit tests without pytest
        run: python test/test_dubins.py

      - name: Byte-compile module
        run: python -m compileall -q dubins_path launch main.py

      - name: Offscreen record (SDL dummy)
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python main.py --mode record --output "${RUNNER_TEMP}/dubins_demo.gif"
          test -s "${RUNNER_TEMP}/dubins_demo.gif"

      - name: Assert gif size
        run: |
          python - <<'PY'
          import os
          gif = os.path.join(os.environ["RUNNER_TEMP"], "dubins_demo.gif")
          size = os.path.getsize(gif)
          assert size < 5 * 1024 * 1024, "gif 超过 5 MB: %d" % size
          print("gif bytes:", size)
          PY