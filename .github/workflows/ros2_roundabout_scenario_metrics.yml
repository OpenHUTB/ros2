name: ROS 2 - roundabout scenario metrics

on:
  push:
    paths:
      - 'src/ground/carla_nn_roundabout_entry/**'
      - '.github/workflows/ros2_roundabout_scenario_metrics.yml'
  pull_request:
    paths:
      - 'src/ground/carla_nn_roundabout_entry/**'
      - '.github/workflows/ros2_roundabout_scenario_metrics.yml'
  workflow_dispatch:

jobs:
  humble-build-test-evaluate:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and run paired multi-seed evaluation
        run: bash src/ground/carla_nn_roundabout_entry/test/humble_metrics_acceptance.sh
