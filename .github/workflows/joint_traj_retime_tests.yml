name: joint_traj_retime tests

# 只跑本模块：14 项单元测试 + 语法检查 + CLI 三张表。
# 纯 numpy，不需要 ROS 2、不需要机器人模型。

on:
  push:
    paths:
      - "src/humanoid/joint_traj_retime/**"
      - "docs/humanoid/joint_traj_retime.md"
      - ".github/workflows/joint_traj_retime_tests.yml"
  pull_request:
    paths:
      - "src/humanoid/joint_traj_retime/**"
      - "docs/humanoid/joint_traj_retime.md"
      - ".github/workflows/joint_traj_retime_tests.yml"

jobs:
  test:
    name: unittest + cli (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install numpy
        run: python -m pip install "numpy>=1.20"

      - name: Unit tests
        working-directory: src/humanoid/joint_traj_retime
        run: python -m unittest discover -s test -p "test_*.py" -v

      - name: Syntax check
        working-directory: src/humanoid/joint_traj_retime
        run: python -m compileall -q joint_traj_retime launch tools main.py

      - name: CLI tables
        working-directory: src/humanoid/joint_traj_retime
        run: python main.py
