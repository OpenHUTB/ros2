name: UAV Power-line Inspection Tests

on:
  push:
    paths:
      - 'src/air/uav_powerline_inspection/**'
      - 'docs/air/uav_powerline_inspection.md'
      - '.github/workflows/uav_powerline_inspection_tests.yml'
  pull_request:
    paths:
      - 'src/air/uav_powerline_inspection/**'
      - 'docs/air/uav_powerline_inspection.md'
      - '.github/workflows/uav_powerline_inspection_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ROS 2 Humble test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl gnupg lsb-release
          sudo add-apt-repository universe
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            ros-humble-ros-base \
            python3-colcon-common-extensions \
            python3-rosdep
          sudo rosdep init || true
          rosdep update

      - name: Create focused workspace and install dependencies
        run: |
          mkdir -p ros2_ws/src
          ln -s "$GITHUB_WORKSPACE/src/air/uav_powerline_inspection" \
            ros2_ws/src/uav_powerline_inspection
          source /opt/ros/humble/setup.bash
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y

      - name: Build package
        run: |
          cd ros2_ws
          source /opt/ros/humble/setup.bash
          colcon build --packages-select uav_powerline_inspection

      - name: Run complete ament test suite
        run: |
          cd ros2_ws
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --return-code-on-test-failure \
            --packages-select uav_powerline_inspection
          colcon test-result --verbose

      - name: Verify installed command and README
        run: |
          cd ros2_ws
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 run uav_powerline_inspection preview \
            --pole-count 3 --pole-spacing 40 --output /tmp/powerline_route.json
          test -s /tmp/powerline_route.json
          test -f install/uav_powerline_inspection/share/uav_powerline_inspection/README.md

      - name: Verify invalid spacing is rejected
        run: |
          cd ros2_ws
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          if ros2 run uav_powerline_inspection preview \
            --pole-spacing=-40 --output /tmp/invalid_route.json; then
            echo "Negative pole spacing unexpectedly succeeded"
            exit 1
          fi
          test ! -e /tmp/invalid_route.json
