name: UAV Power-line Inspection Tests

on:
  push:
    paths:
      - 'src/air/uav_powerline_inspection/**'
      - 'docs/air/uav_powerline_inspection.md'
      - '.github/workflows/uav_powerline_inspection_tests.yml'
  pull_request:
    paths:
      - 'src/air/uav_powerline_inspection/**'
      - 'docs/air/uav_powerline_inspection.md'
      - '.github/workflows/uav_powerline_inspection_tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Planner and CLI tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/air/uav_powerline_inspection
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest flake8 pydocstyle build

      - name: Run planner and CLI tests
        run: python -m pytest test/test_planner.py test/test_cli.py -q

      - name: Run style checks
        run: |
          python -m flake8 uav_powerline_inspection test setup.py
          python -m pydocstyle uav_powerline_inspection test

      - name: Verify package data
        run: |
          python -m build --wheel
          python -c "import glob, zipfile; wheel=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(wheel).namelist(); assert any(name.endswith('share/uav_powerline_inspection/README.md') for name in names)"
