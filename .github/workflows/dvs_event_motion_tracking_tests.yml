name: DVS event motion tracking tests (no ROS / simulator)

on:
  push:
    paths:
      - 'src/ground/dvs_event_motion_tracking/**'
      - 'docs/ground/dvs_event_motion_tracking.md'
      - '.github/workflows/dvs_event_motion_tracking_tests.yml'
  pull_request:
    paths:
      - 'src/ground/dvs_event_motion_tracking/**'
      - 'docs/ground/dvs_event_motion_tracking.md'
      - '.github/workflows/dvs_event_motion_tracking_tests.yml'

jobs:
  test:
    name: Stdlib regression / replay / sweep
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Collectable unittest suite
        working-directory: src/ground/dvs_event_motion_tracking
        run: python3 -m unittest discover -s tests -v

      - name: pytest collection
        run: |
          python3 -m pip install --upgrade pip pytest
          python3 -m pytest src/ground/dvs_event_motion_tracking/tests -q

      - name: Self-test wrapper under -O (asserts must still run)
        working-directory: src/ground/dvs_event_motion_tracking
        run: python3 -O main.py --self-test

      - name: Offline replay (no Pillow, no simulator)
        working-directory: src/ground/dvs_event_motion_tracking
        run: python3 main.py --no-plot

      - name: Parameter sweep writes a real comparison table
        working-directory: src/ground/dvs_event_motion_tracking
        run: |
          python3 main.py --sweep
          test -s data/dvs_sweep.csv
          test -s data/dvs_sweep.json
