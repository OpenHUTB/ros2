name: MuJoCo muscle gripper tests

on:
  push:
    paths:
      - "src/musculoskeletal/mujoco_muscle_gripper/**"
      - ".github/workflows/mujoco_muscle_gripper_tests.yml"
  pull_request:
    paths:
      - "src/musculoskeletal/mujoco_muscle_gripper/**"
      - ".github/workflows/mujoco_muscle_gripper_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python 3.12, headless MuJoCo)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src/musculoskeletal/mujoco_muscle_gripper

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/musculoskeletal/mujoco_muscle_gripper/requirements.txt

      - name: Install module dependencies
        run: python -m pip install -r src/musculoskeletal/mujoco_muscle_gripper/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s src/musculoskeletal/mujoco_muscle_gripper/tests -v
