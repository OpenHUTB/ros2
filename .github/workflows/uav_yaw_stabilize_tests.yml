name: uav_yaw_stabilize tests

on:
  push:
    paths:
      - "src/air/uav_yaw_stabilize/**"
      - ".github/workflows/uav_yaw_stabilize_tests.yml"
  pull_request:
    paths:
      - "src/air/uav_yaw_stabilize/**"
      - ".github/workflows/uav_yaw_stabilize_tests.yml"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/air/uav_yaw_stabilize/requirements.txt pytest
      - name: Run tests
        working-directory: src/air/uav_yaw_stabilize
        run: python -m pytest tests -v
      - name: Run simulation
        working-directory: src/air/uav_yaw_stabilize
        run: python main.py --out-dir results
      - name: Check artifacts
        working-directory: src/air/uav_yaw_stabilize
        run: |
          test -s results/yaw_response.png
          test -s results/yaw_demo.gif
          test -s results/summary.json
          python - <<'PY'
          import json
          d = json.load(open("results/summary.json", encoding="utf-8"))
          m = d["metrics"]
          assert m["settle_time"] is not None, m
          assert m["gust_peak"] < 10.0, m
          print("metrics ok:", m)
          PY
