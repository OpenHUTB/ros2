name: Humanoid ARS phase walk tests

on:
  push:
    paths:
      - 'src/humanoid/humanoid_ars_phase_walk/**'
      - '.github/workflows/humanoid_ars_phase_walk_tests.yml'
  pull_request:
    paths:
      - 'src/humanoid/humanoid_ars_phase_walk/**'
      - '.github/workflows/humanoid_ars_phase_walk_tests.yml'

jobs:
  test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        test:
          - src/humanoid/humanoid_ars_phase_walk/test/test_standalone.py
          - src/humanoid/humanoid_ars_phase_walk/test/test_integration.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "mujoco>=3.3.0" numpy matplotlib
      - name: Run test
        run: python3 ${{ matrix.test }}