name: UGV SLAM nav tests

on:
  push:
    paths:
      - 'src/ground/ugv_slam_nav/**'
      - 'docs/ground/ugv_slam_nav.md'
      - '.github/workflows/ugv_slam_nav_tests.yml'
  pull_request:
    paths:
      - 'src/ground/ugv_slam_nav/**'
      - 'docs/ground/ugv_slam_nav.md'
      - '.github/workflows/ugv_slam_nav_tests.yml'

jobs:
  test:
    name: Local tests (no ROS / simulator)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: python3 -m pip install --upgrade pip numpy pyyaml
      - name: Byte-compile
        run: |
          python3 -m py_compile src/ground/ugv_slam_nav/ugv_slam_nav/*.py \
            src/ground/ugv_slam_nav/test/*.py \
            src/ground/ugv_slam_nav/launch/*.py \
            src/ground/ugv_slam_nav/setup.py \
            src/ground/ugv_slam_nav/main.py
      - name: Run unit tests
        working-directory: src/ground/ugv_slam_nav
        run: python3 test/test_ugv_slam_nav_local.py -v
