name: Rotor failure allocation tests

on:
  push:
    paths:
      - 'src/air/uav_rotor_failure_allocation/**'
      - '.github/workflows/rotor_failure_allocation_tests.yml'
  pull_request:
    paths:
      - 'src/air/uav_rotor_failure_allocation/**'
      - '.github/workflows/rotor_failure_allocation_tests.yml'

jobs:
  test:
    name: Allocation tests (no ROS / simulator)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/air/uav_rotor_failure_allocation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip "numpy<3" "pytest>=7"

      - name: Run allocation tests
        run: python3 -m pytest test -v

      - name: Byte-compile the module
        run: python3 -m py_compile main.py uav_rotor_failure_allocation/*.py launch/main.launch.py
