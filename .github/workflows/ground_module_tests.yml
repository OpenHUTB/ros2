name: Ground module offline tests

# 为 5 个只依赖 numpy 的地面动力学/操稳模块补 PR 级回归保护。
# 全部测试都是纯 Python 离线自检，不需要 ROS / 仿真器 / GPU。
on:
  push:
    paths:
      - 'src/ground/tire_slip_curve/**'
      - 'src/ground/rollover_margin/**'
      - 'src/ground/drive_cycle_energy/**'
      - 'src/ground/ride_comfort_transmissibility/**'
      - 'src/ground/lateral_stability_margin/**'
      - 'tests/test_tire_slip_curve_local.py'
      - 'tests/test_rollover_margin_local.py'
      - 'tests/test_drive_cycle_energy_local.py'
      - 'tests/test_ride_comfort_transmissibility_local.py'
      - 'tests/test_lateral_stability_margin_local.py'
      - '.github/workflows/ground_module_tests.yml'
  pull_request:
    paths:
      - 'src/ground/tire_slip_curve/**'
      - 'src/ground/rollover_margin/**'
      - 'src/ground/drive_cycle_energy/**'
      - 'src/ground/ride_comfort_transmissibility/**'
      - 'src/ground/lateral_stability_margin/**'
      - 'tests/test_tire_slip_curve_local.py'
      - 'tests/test_rollover_margin_local.py'
      - 'tests/test_drive_cycle_energy_local.py'
      - 'tests/test_ride_comfort_transmissibility_local.py'
      - 'tests/test_lateral_stability_margin_local.py'
      - '.github/workflows/ground_module_tests.yml'

jobs:
  test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_tire_slip_curve_local.py
          - test_rollover_margin_local.py
          - test_drive_cycle_energy_local.py
          - test_ride_comfort_transmissibility_local.py
          - test_lateral_stability_margin_local.py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pyyaml

      - name: Run offline test
        env:
          PYTHONIOENCODING: utf-8
        run: python3 tests/${{ matrix.test }}
