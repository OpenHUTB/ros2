name: Repo hygiene (gitignore)

on:
  push:
    paths:
      - '.gitignore'
      - '**/.gitignore'
      - '**/requirements*.txt'
      - '.github/workflows/gitignore_requirements.yml'
  pull_request:
    paths:
      - '.gitignore'
      - '**/.gitignore'
      - '**/requirements*.txt'
      - '.github/workflows/gitignore_requirements.yml'

jobs:
  requirements-not-ignored:
    name: Dependency lists are not swallowed by *.TXT
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库根 .gitignore 里的 *.TXT 在大小写不敏感的文件系统上会连 .txt 一起匹配，
      # 这里模拟「新增模块 + 依赖清单」并断言忽略规则的行为。
      - name: Create a probe module with dependency lists
        run: |
          mkdir -p src/air/ci_probe
          printf 'numpy\n'  > src/air/ci_probe/requirements.txt
          printf 'pytest\n' > src/air/ci_probe/requirements-dev.txt
          printf 'junk\n'   > src/air/ci_probe/NOTES.TXT
          mkdir -p docs
          printf 'generated by hooks.py\n' > docs/requirements.txt

      - name: Assert requirements files are tracked-able
        run: |
          for path in src/air/ci_probe/requirements.txt src/air/ci_probe/requirements-dev.txt; do
            if git check-ignore -q "$path"; then
              echo "FAIL: $path is ignored by .gitignore"
              exit 1
            fi
            echo "ok: $path is not ignored"
            git add -n "$path" | grep -q "add '.*$(basename "$path")'" \
              && echo "ok: git add would pick $path up" \
              || { echo "FAIL: git add would skip $path"; exit 1; }
          done

      - name: Assert other *.TXT and generated docs requirements stay ignored
        run: |
          if ! git check-ignore -q src/air/ci_probe/NOTES.TXT; then
            echo "FAIL: other .TXT files must stay ignored"
            exit 1
          fi
          echo "ok: other .TXT files stay ignored"
          if ! git check-ignore -q docs/requirements.txt; then
            echo "FAIL: docs/requirements.txt is generated by hooks.py and must stay ignored"
            exit 1
          fi
          echo "ok: docs/requirements.txt stays ignored"

      - name: Show the resolved rules
        run: |
          echo "--- requirements.txt"
          git check-ignore -v src/air/ci_probe/requirements.txt || true
          echo "--- requirements-dev.txt"
          git check-ignore -v src/air/ci_probe/requirements-dev.txt || true
          echo "--- NOTES.TXT"
          git check-ignore -v src/air/ci_probe/NOTES.TXT || true
          echo "--- docs/requirements.txt"
          git check-ignore -v docs/requirements.txt || true
