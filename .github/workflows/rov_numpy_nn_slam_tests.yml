name: rov_numpy_nn_slam tests

# 水下机器人 RVNN 模块的离线测试：不需要 ROS，但需要 MuJoCo（物理仿真）。
# 只在该模块或本 workflow 变更时触发。

on:
  push:
    paths:
      - 'src/water/rov_numpy_nn_slam/**'
      - '.github/workflows/rov_numpy_nn_slam_tests.yml'
  pull_request:
    paths:
      - 'src/water/rov_numpy_nn_slam/**'
      - '.github/workflows/rov_numpy_nn_slam_tests.yml'

jobs:
  test:
    name: Local tests (MuJoCo, no ROS)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy>=1.20" pyyaml "mujoco==3.2.3"

      - name: Byte-compile module
        run: python3 -m compileall -q src/water/rov_numpy_nn_slam

      - name: Run module tests
        working-directory: src/water/rov_numpy_nn_slam
        run: |
          python3 tests/smoke_sim.py
          python3 tests/test_control.py
          python3 tests/test_planning.py
          python3 tests/test_slam.py
