name: uav_emergency_drop tests

on:
  push:
    paths:
      - 'src/air/uav_emergency_drop/**'
      - '.github/workflows/ci_uav_emergency_drop.yml'
  pull_request:
    paths:
      - 'src/air/uav_emergency_drop/**'
      - '.github/workflows/ci_uav_emergency_drop.yml'

jobs:
  test:
    name: Local tests (no ROS / MuJoCo)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip numpy matplotlib pyyaml pytest

      - name: Run module tests
        working-directory: src/air/uav_emergency_drop
        run: PYTHONPATH=${{ github.workspace }}/src/air python3 -m pytest test/ -q
