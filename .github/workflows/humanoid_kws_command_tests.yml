name: Humanoid KWS command tests

# 离线语音指令模块：前端/模型单测 + 基于随包特征的集成训练评测。
# 不需要 ROS，也不需要 TTS 语料（特征已随仓库分发）。
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/humanoid/humanoid_kws_command/**'
      - '.github/workflows/humanoid_kws_command_tests.yml'
  pull_request:
    paths:
      - 'src/humanoid/humanoid_kws_command/**'
      - '.github/workflows/humanoid_kws_command_tests.yml'

jobs:
  test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        test:
          - src/humanoid/humanoid_kws_command/test/test_standalone.py
          - src/humanoid/humanoid_kws_command/test/test_integration.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install numpy
        run: python3 -m pip install --upgrade pip numpy
      - name: Run test
        run: python3 ${{ matrix.test }}