name: Air frustum tests

on:
  push:
    paths:
      - 'src/air/uav_camera_frustum_viz/**'
      - '.github/workflows/air_frustum_tests.yml'
  pull_request:
    paths:
      - 'src/air/uav_camera_frustum_viz/**'
      - '.github/workflows/air_frustum_tests.yml'

jobs:
  test:
    name: Frustum visualization tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip numpy

      - name: Run frustum geometry tests
        run: python3 src/air/uav_camera_frustum_viz/test/test_frustum_local.py

      - name: Byte-compile frustum scripts
        run: python3 -m py_compile src/air/uav_camera_frustum_viz/scripts/*.py
