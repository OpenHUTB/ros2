site_name: CARLA 0.9.16 无人车神经网络四次作业文档
site_description: 基于 CARLA 0.9.16 的无人车神经网络课题：四次作业实现与文档
repo_url: https://github.com/OpenHUTB/ros2
repo_name: OpenHUTB/ros2

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking

nav:
  - 首页: index.md
  - 环境安装: setup_guide.md
  - 作业一 · 键盘控制: 01_control.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mathjax.js
