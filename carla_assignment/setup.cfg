# ament_python 打包元数据（与 setup.py 配套）。
# 定义 console 入口脚本的生成方式，以及 flake8/pep257 测试所需配置。
[develop]
script_dir=$base/lib/carla_assignment
[install]
install_scripts=$base/lib/carla_assignment

# 作业可执行入口：每个作业都提供命令行命令，满足"main 脚本直接运行整个模块"。
[entry_points]
console_scripts =
    carla_control = carla_assignment.01_control.main:main
    carla_perception = carla_assignment.02_perception.main:main
    carla_navigation = carla_assignment.03_navigation.main:main
    carla_end_to_end = carla_assignment.04_end_to_end.main:cli

# flake8 (Noetic/Humble ament 常用配置)
[flake8]
extend-ignore = E501
use_pycodestyle = False
