# - mdx_math 用于行内公式显示
markdown_extensions:
  - markdown_grid_tables
  - footnotes
  - admonition
  - mdx_math:
      enable_dollar_delimiter: true
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
