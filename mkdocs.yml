site_name: 模拟器的 ROS 文档
# 参考链接：https://blog.csdn.net/m0_63203517/article/details/129765689
#repo_url: https://github.com/carla-simulator/carla
#docs_dir: Docs
#edit_uri: 'edit/master/Docs/'
# 设置编译页面的链接的前缀
repo_url: https://github.com/OpenHUTB/ros2
# 页面右上角添加直接编辑页面的按钮
edit_uri: edit/master/docs/
theme:
  name: readthedocs
  sticky_navigation: True
  navigation_depth: 3
  features:
    - search.suggest # 在目录栏中的搜索框中输入一些字母时推荐补全整个单词
extra_css: [extra.css]
# mathjax用于单独公式展示
extra_javascript:
  # - extra.js
  # 国内可达 CDN：原 cdnjs.cloudflare.com 在国内网络下无法加载导致公式/mermaid 不渲染
  - https://cdn.bootcdn.net/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  - https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js
  - https://cdn.bootcdn.net/ajax/libs/raphael/2.2.7/raphael.min.js
  - https://cdn.bootcdn.net/ajax/libs/underscore.js/1.8.3/underscore-min.js
  - https://cdn.bootcdn.net/ajax/libs/js-sequence-diagrams/1.0.6/sequence-diagram-min.js
  - https://cdn.bootcdn.net/ajax/libs/flowchart/1.6.5/flowchart.min.js
  - js/umlconvert.js
plugins:
#  - mkdocs-video
  - search:
      lang: ja
      separator: '[\s\-\.]+'
      min_search_length: 3
  - bibtex:
      bib_file: refs.bib
      csl_file: nature.csl
