site_name: 模拟器的 ROS 文档
# 参考链接：https://blog.csdn.net/m0_63203517/article/details/129765689

#repo_url: https://github.com/carla-simulator/carla
#docs_dir: Docs
#edit_uri: 'edit/master/Docs/'


# 设置编译页面的链接的前缀
repo_url: https://github.com/OpenHUTB/ros2

# 页面右上角添加直接编辑页面的按钮
edit_uri: edit/master/docs/

theme:
  name: readthedocs
  sticky_navigation: True
  navigation_depth: 3
  features:
    - search.suggest # 在目录栏中的搜索框中输入一些字母时推荐补全整个单词
extra_css: [extra.css]



# mathjax用于单独公式展示
extra_javascript:
  # - extra.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  - https://cdn.rawgit.com/knsv/mermaid/6.0.0/dist/mermaid.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/raphael/2.2.7/raphael.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.3/underscore-min.js
  - https://cdnjs.cloudflare.com/ajax/libs/js-sequence-diagrams/1.0.6/sequence-diagram-min.js
  - https://cdnjs.cloudflare.com/ajax/libs/flowchart/1.6.5/flowchart.min.js
  - js/umlconvert.js

plugins:
#  - mkdocs-video
  - search:
      lang: ja
      separator: '[\s\-\.]+'
      min_search_length: 3
  - bibtex:
      bib_file: refs.bib
      csl_file: nature.csl
      # 关闭裸 @key 行内引用：避免代码块中的 @staticmethod 被误判为文献引用
      enable_inline_citations: false
  - mkdocs-video:
      is_video: True
      video_autoplay: True
      video_loop: True

extra:
  generator: false

hooks:
  - hooks.py

copyright: OpenHUTB 版权所有 &copy; {year}


nav:
- 入门:
    - 首页: 'index.md'
    - 安装 ROS: 'ubuntu20.04.md'
- ROS 教程:
    - 1. 认识 ROS: 'chapter/chap1/chap1.md'
    - 2. ROS 基础 - ROS 基础: './chapter/chap2.md'
    - 3. 机器人系统设计: './chapter/chap3.md'
    - 4. 机器人仿真: './chapter/chap4.md'
    - 5. 机器人感知: './chapter/chap5.md'
    - 6. 机器人 SLAM 与自主导航: './chapter/chap6.md'
    - 7. 机械臂控制: './chapter/chap7.md'
    - 8. ROS 机器人综合应用: './chapter/chap8.md'
    - 9. ROS 2: './chapter/chap9.md'
- 地面载具:
    - 手动控制: './set_up_and_connect_to_carla.md'
    - 生成对象: './ground/carla_spawn_objects.md'
    - 阿克曼控制: './ground/ackermann_control.md'
    - 路径点发布器: './ground/waypoint.md'
    - 自动驾驶代理: './ground/ad_agent.md'
    - 自动驾驶示例: './ground/ad_demo.md'
    - ROS Scenario Runner: './ground/ros_scenario_runner.md'
    - RVIZ Carla 插件: './ground/rviz_plugin.md'
- 空域载具:
    - 建立虚拟机和空域载具之间的连接: './air/setup_and_connect.md'
    - 空域模拟器的 ROS 封装器: './air/ros_pkgs.md'
    - 无人机终端键盘遥控器: './air/drone_teleop.md'
    - 空域载具八叉树三维寻路:
        - 环境配置与前置准备: 'air/octree_uav_3d_pathfinding/env_setup.md'
    - 低空载具的 ROS 示例教程: 'https://openhutb.github.io/air_doc/airsim_tutorial_pkgs/'
- 水域载具:
    - 水域载具 ROS2 接口: './water/HoloOcean.md'
    - WSL跑通HoloOcean2的ROS2示例方法: './water/WSL_HoloOcean2_ROS2.md'


# - mdx_math 用于行内公式显示
markdown_extensions:
  - markdown_grid_tables
  - footnotes
  - admonition
  - mdx_math
  - pymdownx.superfences:
      custom_fences: [
         { name: flow, class: uml-flowchart }
        ,{ name: sequence, class: uml-sequence-diagram }
        ,{ name: mermaid, class: mermaid }
      ]

